<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #v { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #st { position: absolute; left: 6px; bottom: 4px; color: #6b6b85; font: 11px sans-serif; }
  #msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: #cfcfe6; font: 16px sans-serif; padding: 0 24px; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="msg">Подключаем трансляцию…</div>
<div id="st"></div>
<script>
(function () {
  var v = document.getElementById('v'), msg = document.getElementById('msg');
  var pc = null, pending = [], remoteSet = false, joinT = null, discT = null, nostream = 0;
  var st = document.getElementById('st');
  var ICE = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ];

  function post(o) {
    try {
      var s = JSON.stringify(o);
      if (window.CoBridge && window.CoBridge.postMessage) window.CoBridge.postMessage(s);
      else if (window.CoNative && window.CoNative.postEvent) window.CoNative.postEvent(s);
    } catch (e) {}
  }
  function show(t) { msg.style.display = 'block'; msg.textContent = t; }

  // Просим главного прислать картинку; если за 7 секунд ничего нет — просим ещё раз.
  function join() {
    post({ k: 'rtc', type: 'join' });
    clearTimeout(joinT);
    joinT = setTimeout(function () { if (!(v.videoWidth > 0)) join(); }, 7000);
  }

  window.__rtcIn = async function (m) {
    try {
      if (m.type === 'offer') {
        if (pc) { try { pc.close(); } catch (e) {} }
        pending = []; remoteSet = false; nostream = 0;
        pc = new RTCPeerConnection({ iceServers: ICE });
        var mine = pc;
        pc.onicecandidate = function (e) {
          if (e.candidate) post({ k: 'rtc', type: 'ice', data: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate });
        };
        pc.ontrack = function (e) {
          if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
          v.muted = false;
          v.play().catch(function () {});
          msg.style.display = 'none';
        };
        pc.onconnectionstatechange = function () {
          if (mine !== pc) return;
          var cs = pc.connectionState;
          if (cs === 'connected') {
            clearTimeout(discT);
            if (v.videoWidth > 0) msg.style.display = 'none';
          } else if (cs === 'disconnected') {
            // короткие провалы не показываем: ждём 4 секунды
            clearTimeout(discT);
            discT = setTimeout(function () {
              if (pc === mine && pc.connectionState !== 'connected') { show('Связь потеряна, переподключаем…'); join(); }
            }, 4000);
          } else if (cs === 'failed') {
            show('Связь потеряна, переподключаем…');
            setTimeout(join, 800);
          }
        };
        await pc.setRemoteDescription(m.data);
        remoteSet = true;
        var list = pending.splice(0);
        for (var i = 0; i < list.length; i++) { try { await pc.addIceCandidate(list[i]); } catch (e) {} }
        var ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        post({ k: 'rtc', type: 'answer', data: { type: ans.type, sdp: ans.sdp } });
      } else if (m.type === 'ice') {
        if (pc && remoteSet) { try { await pc.addIceCandidate(m.data); } catch (e) {} }
        else pending.push(m.data);
      } else if (m.type === 'nostream') {
        // у главного ещё нет готового видео: ждём и просим снова (до ~30 секунд)
        nostream++;
        if (nostream > 10) {
          show('Это видео нельзя транслировать');
          post({ k: 'rtcFail' });
        } else {
          show('Ждём видео…');
          setTimeout(join, 3000);
        }
      }
    } catch (e) {}
  };

  // Нажатие на видео — полный экран.
  v.addEventListener('click', function () {
    var f = v.requestFullscreen || v.webkitRequestFullscreen;
    if (f) { try { f.call(v); } catch (e) {} }
  });
  setInterval(function () {
    st.textContent = (pc ? pc.connectionState : '—') + (v.videoWidth ? ' ' + v.videoWidth + 'x' + v.videoHeight : '');
    if (v.videoWidth > 0 && pc && pc.connectionState === 'connected') msg.style.display = 'none';
  }, 1000);
  join();
})();
</script>
</body>
</html>
